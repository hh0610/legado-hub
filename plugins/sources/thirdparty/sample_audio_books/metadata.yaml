contractVersion: "1.0"
id: sample_audio_books
name: 示例有声书源
author: LegadoHub
version: 0.1.0
type: source
domains:
  - sample-audio-books.test
  - soundhelix.com
baseUrls:
  - https://api.sample-audio-books.test
capabilities:
  - search
  - detail
  - toc
  - chapter
auth:
  mode: none
  loginUrl: ""
  accountRequiredFor: []
  cookieDomains: []
content:
  access: free
  kind: audio
  streamDomains:
    - soundhelix.com
tags:
  - audio
  - sample
  - json-api
ui:
  - title: 播放设置
    description: 值保存在服务端，经 ctx.settings 注入插件运行时。
    items:
      - type: number
        id: max_episodes
        label: 目录最大集数
        default: 0
        help: 0 表示不限制，大于 0 时截断 toc 输出。
      - type: toggle
        id: reverse_order
        label: 目录倒序
        default: false
      - type: button
        id: check
        label: 检查目录设置生效情况
        action: ui_check_settings
enabled: true
priority: 90
sourceSeed:
  type: manual
  upstreamId: sample-audio-books
  upstreamFile: ""
  upstreamCommit: ""
